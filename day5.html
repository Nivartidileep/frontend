<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    div{
        background:lightgreen;
        width: 220px;
        height: 200px;
        <padding:20px>
        margin: 20px;
        boarder:2px solid black;
        display: inline-block;
        transition: all 2s;
        box-shadow: 0px 0px 5px 2px red;
    }
    div:hover{
        background:lightsalmon;
        color:white;
        boarder:2px solid rgb(224, 248,12); 
        transform:translate(20px, 10px);
        transform:rotate(-10deg);
        transform:scale(1.2);
        transform:scale(0.8) rotate(10deg);
    }
    h1{
        text-align:right;
        text-align: center;
        text-shadow: 0px 0px 5px 2px red;
    }
    p{
        letter-spacing: 5px;
        word-spacing: 5px;
        line-height: 1.5;
        font-size: 1.3rem;
        font-family: 'cursive';
        font-weight: 900;
    }
    </style>
</head> 
<body>
    <h1>day 2 css</h1>
    <p>
        This is a paragraph with custom styling.
    </p>
    <div>
        box1
    </div>
    <div>
        box2
    </div>
</body>
</html>
